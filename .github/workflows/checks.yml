name: Verify Movie Vault
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          TMDB_READ_ACCESS_TOKEN: ci-server-only-sentinel-tmdb-token
          SUPABASE_SERVICE_ROLE_KEY: ci-server-only-sentinel-service-role-key
      - run: npm run check:secrets
        env:
          TMDB_READ_ACCESS_TOKEN: ci-server-only-sentinel-tmdb-token
          SUPABASE_SERVICE_ROLE_KEY: ci-server-only-sentinel-service-role-key
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: '1'
